# thefinance.ir — public frontend
#
# This file was previously not in any repository: it lived only on the server,
# so the cutover depended on an artifact nobody could review. It is here now so
# the switch is a reviewable diff.
#
# Deployed to /etc/nginx/sites-available/ on the FRONTEND server, symlinked
# into sites-enabled.
#
# =====================================================================
#  CUTOVER  —  /mag from WordPress to Next.js
# =====================================================================
#
#  ONE LINE. Change the port in `set $mag_upstream` below:
#
#      9080  = WordPress          (live today)
#      3100  = Next.js container  (the new Mag)
#
#      sudo vim /etc/nginx/sites-available/thefinance.ir.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
#  ROLLBACK is the same line back to 9080 and another reload. Seconds, no
#  redeploy — which is why the old WordPress theme is never deleted. Reload,
#  not restart: reload finishes in-flight requests instead of dropping them.
#
#  BEFORE cutting over, confirm on staging (new.thefinance.ir):
#      curl -s https://new.thefinance.ir/mag/health          # "wpgraphql"
#      curl -sI https://new.thefinance.ir/mag/ | grep -i robots   # noindex
#      curl -sI https://thefinance.ir/mag/    | grep -i robots   # NOTHING
#
#  AFTER cutting over, the last check inverts — production must NOT be
#  noindexed. Verify it immediately; a noindex left on production removes the
#  whole magazine from the index and does so silently.
# =====================================================================

server {
    listen 80;
    server_name thefinance.ir www.thefinance.ir;
    return 301 https://thefinance.ir$request_uri;
}

server {
    listen 443 ssl;
    # `http2 on;` needs nginx >= 1.25.1. On older builds this is a fatal
    # "unknown directive" and the config will not load — check with `nginx -v`
    # before deploying, and use `listen 443 ssl http2;` instead if the frontend
    # server is on 1.24 or earlier.
    http2 on;
    server_name thefinance.ir;

    ssl_certificate     /etc/letsencrypt/live/thefinance.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thefinance.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    # HSTS belongs here rather than in the app: it applies to the whole host,
    # so a sub-path must not declare it on the main site's behalf.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/rss+xml image/svg+xml application/xml;

    # ---------------------------------------------------------------
    #  THE CUTOVER LINE
    # ---------------------------------------------------------------
    #  9080 = WordPress (live) · 3100 = Next.js Mag
    set $mag_upstream 127.0.0.1:9080;
    # ---------------------------------------------------------------

    location /mag {
        # No URI part after the variable, so nginx forwards the original
        # request URI unchanged — the app owns its own basePath.
        proxy_pass http://$mag_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # LOAD-BEARING. The comment endpoint's rate limit keys on X-Real-IP,
        # because X-Forwarded-For is built with $proxy_add_x_forwarded_for and
        # therefore starts with whatever the CLIENT sent. proxy_set_header
        # REPLACES any client-supplied X-Real-IP, which is what makes it
        # trustworthy. Remove this and the limit is bypassable by one header.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Immutable build assets — hashed filenames, so they can be cached hard.
    # Harmless while WordPress is still upstream: the path simply 404s.
    location /mag/_next/static/ {
        proxy_pass http://$mag_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Media keeps its historical path and is proxied to the CMS host, so image
    # indexing and every external hotlink survive the migration.
    #
    # proxy_hide_header is not optional: the CMS sends X-Robots-Tag: noindex on
    # everything, and without hiding it here the images inherit that header and
    # drop out of Google Images.
    location /wp-content/uploads/ {
        proxy_pass https://wp.thefinance.ir;
        proxy_set_header Host wp.thefinance.ir;
        proxy_hide_header X-Robots-Tag;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Everything else — the main site.
    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
