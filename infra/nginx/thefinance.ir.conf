# thefinance.ir — public frontend
#
# ⚠️ THIS FILE IS A REVIEWABLE REFERENCE, NOT A DEPLOYABLE ARTEFACT.
#    DIFF IT AGAINST THE SERVER. NEVER COPY IT OVER THE LIVE FILE.
#
# The live file is at /etc/nginx/conf.d/thefinance.ir.conf — NOT in
# sites-available, which is where this file used to say. It differs from this
# copy in ways that are not cosmetic, and copying this one over it SENDS ALL OF
# thefinance.ir TO WORDPRESS AND TAKES THE MAIN SITE DOWN.
#
# Reconciled against the live server on 2026-09-06. Known divergences, now
# reflected below:
#
#   main site    live proxies to localhost:7902, not 127.0.0.1:9080
#   TLS          live has NO ssl directives — TLS terminates upstream
#   locale       live redirects /fa /en /ar → /
#   mag block    live is `location /mag/` (trailing slash) with a trailing
#                slash on proxy_pass too — see the cutover note
#
# =====================================================================
#  CUTOVER  —  /mag from WordPress to Next.js
# =====================================================================
#
#  ⚠️ TWO CHANGES, NOT ONE. Changing only the port 404s every route.
#
#      1.  port 9080 → 3100
#      2.  REMOVE THE TRAILING SLASH after the port
#          (in `location /mag/`, swap which of the two proxy_pass lines is
#           commented; also move the port in `location /mag/_next/static/`)
#
#  Why: a trailing slash on proxy_pass makes nginx replace the matched
#  location prefix, so `location /mag/` + `proxy_pass http://…:9080/` strips
#  /mag before the request reaches WordPress — which is what WordPress wants,
#  because it is installed at the root. Next.js is built with
#  `basePath: '/mag'` and expects the FULL path, so it must NOT be stripped.
#
#      WordPress (today):  proxy_pass http://127.0.0.1:9080/;   ← slash
#      Next.js  (cutover): proxy_pass http://127.0.0.1:3100;    ← no slash
#
#      sudo vim /etc/nginx/conf.d/thefinance.ir.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
#  ROLLBACK is both changes back — port to 9080 AND the slash restored — then
#  another reload. Seconds, no redeploy, which is why the old WordPress theme
#  is never deleted. Reload, not restart: reload finishes in-flight requests
#  instead of dropping them.
#
#  BEFORE cutting over, confirm on staging. Staging is now a PATH on this same
#  host, /mag-next/ — new.thefinance.ir was dropped:
#      curl -s  https://thefinance.ir/mag-next/health            # "wpgraphql"
#      curl -sI https://thefinance.ir/mag-next/ | grep -i robots # noindex
#      curl -sI https://thefinance.ir/mag/     | grep -i robots  # NOTHING
#
#  AFTER cutting over, the last check inverts — production must NOT be
#  noindexed. Verify it immediately; a noindex left on production removes the
#  whole magazine from the index and does so silently.
# =====================================================================

# No http→https redirect server here: TLS is terminated upstream, so this
# nginx only ever sees plain http and a redirect written here would loop.
# The redirect lives at the edge.

server {
    # NO TLS HERE. TLS terminates upstream of this server, so there is no
    # `ssl` on the listen directive and no certificate paths — an earlier
    # version of this file had both, and `nginx -t` would fail on the missing
    # Let's Encrypt files before it could do any damage.
    listen 80;
    server_name thefinance.ir;

    client_max_body_size 32M;

    # HSTS is NOT set here. It applies to the whole host and must be sent by
    # whatever terminates TLS; this server only ever speaks plain http, so a
    # header set here would be a claim it cannot back.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/rss+xml image/svg+xml application/xml;

    # ---------------------------------------------------------------
    #  THE CUTOVER LINE  —  change the PORT, nothing else.
    # ---------------------------------------------------------------
    #  9080 = WordPress (live today)
    #  3100 = Next.js Mag
    #
    #  A variable rather than the two-commented-proxy_pass form:
    #
    #      proxy_pass http://127.0.0.1:9080;   # WordPress — current
    #      # proxy_pass http://127.0.0.1:3100; # Next.js — cutover
    #
    #  ...because that shape is a TWO-line edit — comment one, uncomment the
    #  other — and a half-finished edit under pressure is either two active
    #  proxy_pass directives (nginx refuses to load) or none (every request to
    #  /mag 500s). `nginx -t` catches both, but only if it is run. One line
    #  cannot be half done.
    #  ⚠️ NO VARIABLE HERE, AND THAT IS THE POINT.
    #
    #  This block used `set $mag_upstream …` + `proxy_pass http://$mag_upstream;`
    #  so the cutover would be one edit. That is safe only while proxy_pass has
    #  no URI part — and the live server's does. Measured under nginx:
    #
    #    location /mag/  proxy_pass http://$var/;        upstream sees "/"
    #    location /mag/  proxy_pass http://127.0.0.1:P/; upstream sees "/archive"
    #
    #  With a variable, a URI part is sent AS-IS instead of replacing the
    #  matched prefix. The variable form plus the slash the live config needs
    #  would send "/" for every request — every WordPress page rendering the
    #  home page. The convenience was never real once the slash mattered.
    #
    #  So both upstreams are literals, and the cutover is two edits on two
    #  adjacent lines, which is what the live server already looks like.
    # ---------------------------------------------------------------

    location /mag/ {
        #  ⚠️ CUTOVER IS THESE TWO LINES. Swap which one is commented.
        #
        #  The trailing slash is not decoration. A URI part after the upstream
        #  — even a bare "/" — makes nginx REPLACE the matched location prefix
        #  with it, stripping /mag. WordPress needs that, because it is
        #  installed at the ROOT: the /mag in /mag/graphql and /mag/wp-admin is
        #  this stripping, not a subdirectory install.
        #
        #  Next.js is built with basePath '/mag' and needs the full path, so it
        #  must have NO URI part. Change only the port and every route 404s —
        #  Next.js receives "/" and answers 404 for the whole magazine.
        #
        proxy_pass http://127.0.0.1:9080/;    # WordPress — live today
        # proxy_pass http://127.0.0.1:3100;   # Next.js — cutover (no slash)

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # LOAD-BEARING. The comment endpoint's rate limit keys on X-Real-IP,
        # because X-Forwarded-For is built with $proxy_add_x_forwarded_for and
        # therefore starts with whatever the CLIENT sent. proxy_set_header
        # REPLACES any client-supplied X-Real-IP, which is what makes it
        # trustworthy. Remove this and the limit is bypassable by one header.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Immutable build assets — hashed filenames, so they can be cached hard.
    # Harmless while WordPress is still upstream: the path simply 404s.
    # NO trailing slash here, unlike the /mag/ block above, and that asymmetry
    # is deliberate: these are Next.js's own hashed assets and it serves them
    # at the full /mag/_next/… path. Harmless while WordPress is upstream — the
    # path simply 404s — and correct the moment it is not. At cutover this port
    # moves to 3100 as well: three lines, not two.
    location /mag/_next/static/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Media keeps its historical path and is proxied to the CMS host, so image
    # indexing and every external hotlink survive the migration.
    #
    # proxy_hide_header is not optional: the CMS sends X-Robots-Tag: noindex on
    # everything, and without hiding it here the images inherit that header and
    # drop out of Google Images.
    #
    # ⚠️ TWO THINGS HERE WERE WRONG, IN OPPOSITE DIRECTIONS. Read both.
    #
    # 1. THE REQUEST PATH. GraphQL returns `sourceUrl` as
    #    https://thefinance.ir/mag/wp-content/uploads/… , so the browser asks
    #    for the /mag-prefixed path. nginx picks the LONGEST matching prefix,
    #    so without a `location /mag/wp-content/uploads/` block those requests
    #    fall into `location /mag` and go to whatever is serving the magazine.
    #    Today that is WordPress, which serves the image anyway; at cutover it
    #    becomes Next.js, which has no such file, and every image 404s.
    #
    # 2. THE UPSTREAM PATH — and this is the one an earlier fix got backwards.
    #    UPLOADS LIVE AT THE ROOT ON THE CMS, NOT UNDER /mag. Measured against
    #    the real hosts:
    #
    #      https://wp.thefinance.ir/wp-content/uploads/X.jpg       200
    #      https://wp.thefinance.ir/mag/wp-content/uploads/X.jpg   404
    #
    #    The /mag visible in /mag/graphql and /mag/wp-admin comes from nginx on
    #    the CMS host stripping the prefix, NOT from WordPress being installed
    #    in a subdirectory. `proxy_pass https://wp.thefinance.ir;` with no path
    #    preserves the request URI, so it asked the CMS for the 404 form — the
    #    exact failure this block exists to prevent, just moved one hop.
    #
    #    A trailing path on proxy_pass REPLACES the matched location prefix,
    #    which is what strips /mag here.
    location /mag/wp-content/uploads/ {
        proxy_pass https://wp.thefinance.ir/wp-content/uploads/;
        proxy_set_header Host wp.thefinance.ir;
        # Required: the CMS terminates TLS by SNI, and proxy_pass to an https
        # upstream does not send it by default.
        proxy_ssl_server_name on;
        proxy_hide_header X-Robots-Tag;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # The un-prefixed path, for any historical URL that still uses it. No path
    # on proxy_pass here ON PURPOSE: the request URI is already the form the
    # CMS serves, so it must be passed through unchanged.
    location /wp-content/uploads/ {
        proxy_pass https://wp.thefinance.ir;
        proxy_set_header Host wp.thefinance.ir;
        proxy_ssl_server_name on;
        proxy_hide_header X-Robots-Tag;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Locale prefixes from the old site. Present on the live server, absent
    # from this file until today — a reader arriving on a /fa link would have
    # fallen through to the main-site block below and got the wrong page.
    location = /fa { return 301 /; }
    location = /en { return 301 /; }
    location = /ar { return 301 /; }

    # Everything else — the main site.
    #
    # NOT 9080. That is WordPress, and pointing the root at it is precisely the
    # mistake that takes all of thefinance.ir down — which is why the header of
    # this file says to diff, never copy.
    location / {
        proxy_pass http://localhost:7902;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
