# wp.thefinance.ir — CMS host
#
# Deployed to /etc/nginx/sites-available/ on the CMS VPS, symlinked into
# sites-enabled. Requires infra/nginx/ratelimit.conf in /etc/nginx/conf.d/.
#
# THE MOST IMPORTANT THING IN THIS FILE is X-Robots-Tag: noindex.
#
# The same 32 articles are reachable from two hosts — thefinance.ir/mag/<slug>
# and wp.thefinance.ir/mag/<slug>. If Google finds the second, it creates
# duplicate content and dilutes the ranking of the first. The header is what
# prevents that, and its failure is completely silent: the page renders
# perfectly the whole time.
#
# Note the header is repeated inside every proxy location. nginx does NOT
# inherit server-level add_header into a location block that declares its own
# headers, and the server-level header does not reach proxied responses here.
# Verify after every change:
#
#   curl -sI https://wp.thefinance.ir/                     | grep -i x-robots
#   curl -sI https://wp.thefinance.ir/mag/                 | grep -i x-robots
#   curl -sI https://wp.thefinance.ir/mag/<known-slug>/    | grep -i x-robots

server {
    listen 80;
    server_name wp.thefinance.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wp.thefinance.ir;

    ssl_certificate     /etc/letsencrypt/live/wp.thefinance.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wp.thefinance.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /xmlrpc.php { deny all; }

    location = /wp-login.php {
        limit_req zone=wplogin burst=5 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:9080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WordPress is installed under /mag on this host, so the GraphQL endpoint is
    # /mag/graphql — not /graphql. `location = /graphql` is an EXACT match, so
    # it never fired: every query fell through to `location /` and the
    # `graphql` rate-limit zone, the whole point of this block, was never
    # applied. The public schema was effectively unthrottled.
    location = /mag/graphql {
        limit_req zone=graphql burst=20 nodelay;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:9080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WordPress builds some admin URLs with the frontend's /mag prefix —
    # wp.ajax.settings.url is "/mag/wp-admin/admin-ajax.php", a relative path,
    # so no PHP filter can catch it: there is no host to match on. The media
    # library posts every query there and 400s. Accept the prefix and drop it,
    # rather than chasing each place WordPress builds a URL.
    #
    # Server level, not inside a location: a rewrite here runs before location
    # selection, so the order of the blocks below does not matter.
    # Author enumeration. /wp-json/wp/v2/users is blocked below, but ?author=N
    # is the other half of the same door: WordPress redirects it to
    # /author/<username>/, turning a guess at a user ID into a real username
    # and a brute-force attempt on wp-login into a targeted one.
    if ($arg_author) { return 403; }

    rewrite ^/mag(/wp-.*)$ $1 last;

    # This host is a CMS, not a website. The theme still renders a full blog at
    # the root, duplicating the magazine on a second hostname — noindex keeps it
    # out of Google, but there is no reason for it to be reachable at all.
    location = / { return 404; }
    location ^~ /category/ { return 404; }
    location ^~ /tag/      { return 404; }
    location ^~ /author/   { return 404; }
    location ^~ /feed      { return 404; }
    location ~ "^/[0-9]{4}/" { return 404; }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:9080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}
