# new.thefinance.ir — STAGING
#
# Validates the Next.js Mag against real WordPress content before anything
# changes on thefinance.ir. Production stays on WordPress throughout; this host
# touches nothing it serves.
#
# Deployed to /etc/nginx/sites-available/ on the FRONTEND server.
#
# WHY A HOST AND NOT A PATH PREFIX.
#
# The app's `basePath` is `/mag` and Next inlines it at BUILD time — every
# internal link, every asset URL and the router itself are compiled with it.
# Serving the same image under `/mag-staging/` would emit links to `/mag/...`,
# which on this server means WordPress: staging would render once and then
# navigate straight into production. Making a path prefix work needs a second
# image built with a different basePath, i.e. staging would no longer be
# testing the artifact that gets promoted. A separate host keeps the path
# identical, so what is validated here is byte-for-byte what production runs.
#
# =====================================================================
#  THE ONE THING THIS FILE MUST DO: noindex.
# =====================================================================
#  Staging serves the same articles as production. If Google finds them here,
#  the same content is indexed from two hosts and they compete with each other
#  — and it fails silently, because every page renders perfectly the whole
#  time. This is the most common headless-staging mistake and it is the same
#  failure the CMS host's noindex exists to prevent.
#
#  Verify after every change to this file, and check BOTH directions:
#      curl -sI https://new.thefinance.ir/mag/           | grep -i x-robots
#          → X-Robots-Tag: noindex, nofollow
#      curl -sI https://thefinance.ir/mag/               | grep -i x-robots
#          → nothing at all
#
#  The header is repeated inside every location on purpose. nginx does NOT
#  inherit a server-level add_header into a location that declares its own —
#  the same trap documented on the CMS host.
# =====================================================================

server {
    listen 80;
    server_name new.thefinance.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # `http2 on;` needs nginx >= 1.25.1. On older builds this is a fatal
    # "unknown directive" and the config will not load — check with `nginx -v`
    # before deploying, and use `listen 443 ssl http2;` instead if the frontend
    # server is on 1.24 or earlier.
    http2 on;
    server_name new.thefinance.ir;

    ssl_certificate     /etc/letsencrypt/live/new.thefinance.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.thefinance.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/rss+xml image/svg+xml application/xml;

    # Belt and braces with the header above: a crawler that reads robots.txt
    # before requesting a page never asks for one.
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # The Next.js container. 3100 on the host, 3000 inside, bound to localhost
    # so nginx is the only way in.
    location /mag {
        proxy_pass http://127.0.0.1:3100;

        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # Same reason as production: the comment rate limit keys on this.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Media, so staging renders real images without copying anything. Note the
    # X-Robots-Tag here is NOT hidden — on staging the images should stay
    # unindexed too. Production is the opposite and hides it deliberately.
    #
    # ⚠️ THE /mag/ PREFIX IS THE ONE THAT MATTERS, and it was missing.
    #
    # WordPress is installed under /mag, so uploads live at
    # /mag/wp-content/uploads/ — that is what `next.config.ts` allow-lists in
    # remotePatterns. nginx picks the LONGEST matching prefix, so
    # /mag/wp-content/uploads/x.jpg matches `location /mag` above and never
    # reaches the un-prefixed block. On staging `/mag` already points at
    # Next.js, which has no such file, so every image here 404s today.
    #
    # Both paths are kept. The /mag one is longer than `/mag`, so it wins.
    location /mag/wp-content/uploads/ {
        proxy_pass https://wp.thefinance.ir;
        proxy_set_header Host wp.thefinance.ir;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The un-prefixed path, kept in case any historical URL still uses it.
    location /wp-content/uploads/ {
        proxy_pass https://wp.thefinance.ir;
        proxy_set_header Host wp.thefinance.ir;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Nothing else is served from staging. The magazine is the only thing under
    # test, and an accidental copy of the main site here would be another
    # duplicate.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }
}
