<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="مجله فایننس">
<!--
  The tab icon. Same mark as MagLogo.tsx, in the LIGHT colourway supplied with
  the favicon pack: white plate, #071331 triangle, the three logo blues.

  WHY A PLATE AND NOT THE PACK'S TRANSPARENT PNG. The pack ships the mark on
  transparency with a #071331 triangle, which measures about 1.1:1 against
  Chrome's dark tab strip (#202124): rendered at 16 and 32 the triangle and its
  baseline disappear and three blue bars float with no shape around them. An
  icon has no control over what is behind it, so the ground has to be part of
  the icon. White, because that is the ground this colourway was drawn for.

  WHY VECTOR AND NOT THE PACK'S RASTER. Same artwork, same four colours sampled
  straight out of android-chrome-512x512.png, 900 bytes against 33KB, and sharp
  at every size a browser asks for instead of at the three it was exported at.

  WHY NO «FINANCE PULSE» WORDMARK. Two reasons, either sufficient. It is
  illegible below about 48px — at 32 it renders as a row of grey speckle and at
  16 it is gone — and it costs a tenth of the icon's height to say nothing.
  And the magazine is «مجله فایننس» / TheFinance; "Pulse" appears nowhere in
  this product. A tab is the last place to introduce a name the site does not
  use. The full lockup is kept for the launcher sizes, where it is legible.
-->
<rect width="64" height="64" rx="14" fill="#FFFFFF"></rect>
<g transform="translate(32 32) scale(0.72) translate(-164 -28)"><path fill-rule="evenodd" clip-rule="evenodd" d="M157.553 47.8532L147.104 29.5693H139.047L149.495 47.8532H157.553Z" fill="#0163E1"></path>
<path fill-rule="evenodd" clip-rule="evenodd" d="M169.472 47.8527L153.061 19.1367H145.003L161.414 47.8527H169.472Z" fill="#10A5F5"></path>
<path fill-rule="evenodd" clip-rule="evenodd" d="M140.222 51.1897H187.777C178.939 35.7227 170.099 20.256 161.26 4.78892L163.997 0L196 56H132L141.438 39.4828L144.176 44.2717L140.222 51.1896V51.1897Z" fill="#071331"></path>
<path fill-rule="evenodd" clip-rule="evenodd" d="M159.02 8.70898H150.962L173.332 47.8529H181.39L159.02 8.70898Z" fill="#00DBFF"></path></g>
</svg>
